<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>QR Studio</h1>
            <p>Upload an image to generate a QR code linking directly to it.</p>
        </header>

        <main class="app-content">
            <section class="tab-content active">
                <div class="input-group">
                    <label class="file-upload-btn primary-btn outline">
                        Take Photo / Upload Image
                        <input type="file" id="image-upload" accept="image/*" class="hidden-input">
                    </label>
                    <div id="file-name-display" class="status-text hidden">No file selected</div>
                    <button id="generate-btn" class="primary-btn mt-3" disabled>Generate QR Code</button>
                </div>
                
                <div id="result-container" class="hidden result-box">
                    <div class="qr-wrapper">
                        <img id="qr-image" src="" alt="Generated QR Code">
                    </div>
                    <div class="action-buttons">
                        <a id="download-btn" href="#" download="qrcode.png" class="secondary-btn">Download</a>
                        <button id="whatsapp-btn" class="secondary-btn" style="color: white; background: #25D366; border-color: #25D366;">Share on WhatsApp</button>
                    </div>
                </div>
                
                <div id="loading" class="hidden">
                    <div class="spinner"></div>
                    <p class="status-text">Uploading and Generating...</p>
                </div>
                <div id="generate-error-message" class="error-message hidden"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
